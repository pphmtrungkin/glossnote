# Local development Postgres for GlossNote.
#
# Credentials and port deliberately match the DATABASE_URL in apps/server/.env:
#   postgresql://postgres:password@localhost:5432/postgres
# If you change one, change the other — drizzle.config.ts reads that same URL,
# so a mismatch shows up as an opaque ECONNREFUSED from drizzle-kit.
#
# Start with `bun run db:start` from the repo root.
services:
  postgres:
    image: postgres:18-alpine
    container_name: glossnote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # Named volume, so `docker compose down` keeps your data. Use
      # `docker compose down -v` when you actually want a clean slate.
      #
      # Mounted at /var/lib/postgresql, NOT the /var/lib/postgresql/data you
      # see in most older examples. Postgres 18+ images store data in a
      # major-version subdirectory (.../18/docker) so pg_upgrade --link can
      # work across a single mount point; mounting the old path makes the
      # container boot-loop with "there appears to be PostgreSQL data in
      # /var/lib/postgresql/data (unused mount/volume)".
      - glossnote-pgdata:/var/lib/postgresql
    healthcheck:
      # Lets `docker compose up -d --wait` block until Postgres is genuinely
      # accepting connections, rather than just until the container exists —
      # the gap between those two is what makes a migration run straight after
      # startup fail intermittently.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  glossnote-pgdata:
